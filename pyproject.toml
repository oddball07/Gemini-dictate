[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-dictate"
dynamic = ["version"]
description = "Windows dictation widget that uses the Gemini website's own speech-to-text, with AI cleanup and a prompt mode."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["dictation", "speech-to-text", "gemini", "voice", "windows", "prompt"]
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Environment :: Win32 (MS Windows)",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "websocket-client",
  "pystray",
  "pillow",
  "keyboard",
  "pyperclip",
  "google-genai",
  "groq",
]

[project.gui-scripts]
dictate = "gemini_dictate.app:main"          # no console window

[project.scripts]
dictate-setup = "gemini_dictate.cli:main"

[tool.setuptools.dynamic]
version = { attr = "gemini_dictate.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
